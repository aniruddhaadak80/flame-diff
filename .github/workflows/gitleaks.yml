name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@b32e38273e77c6da5e7f7fae2f7214d1b9446605 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
